<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ATS Resume Studio Clipper</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
    }
    .status {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .result.success {
      display: block;
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
    .result.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">🎯</span>
    <span class="title">ATS Studio Clipper</span>
  </div>
  <p class="status">
    Import this job directly into your local ATS Resume Studio with 1 click.
  </p>
  <button id="clipBtn" class="btn">
    🚀 Send Active Tab to Studio
  </button>
  <div id="result" class="result"></div>
  <div class="footer">
    Works on Indeed, LinkedIn, Glassdoor & Company Career Pages
  </div>

  <script src="popup.js"></script>
</body>
</html>
